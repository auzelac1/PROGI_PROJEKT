<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#111"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill:#111; }
    .title { font-size: 22px; font-weight: 700; }
    .label { font-size: 16px; }
    .small { font-size: 13px; }
    .box { fill:#fff; stroke:#111; stroke-width:2; }
    .uc { fill:#fff; stroke:#111; stroke-width:2; }
    .line { stroke:#111; stroke-width:2; fill:none; }
    .dash { stroke:#111; stroke-width:1.8; fill:none; stroke-dasharray:7 5; }
    .note { fill:#fffde7; stroke:#777; stroke-width:1.2; }
  </style>

  <text x="450" y="34" text-anchor="middle" class="title">UC-009: Statistika i izvoz</text>

  <!-- Actor -->
  <circle cx="70" cy="205" r="22" class="line"/>
  <line x1="70" y1="227" x2="70" y2="290" class="line"/>
  <line x1="40" y1="252" x2="100" y2="252" class="line"/>
  <line x1="70" y1="290" x2="45" y2="330" class="line"/>
  <line x1="70" y1="290" x2="95" y2="330" class="line"/>
  <text x="70" y="360" text-anchor="middle" class="label">Voditelj</text>

  <!-- System -->
  <rect x="140" y="70" width="720" height="500" rx="5" class="box"/>
  <text x="160" y="100" class="label" font-weight="700">Charter sustav</text>

  <!-- Main UC -->
  <ellipse cx="365" cy="250" rx="125" ry="62" class="uc"/>
  <text x="365" y="242" text-anchor="middle" class="label" font-weight="700">UC-009</text>
  <text x="365" y="268" text-anchor="middle" class="label">Statistika i izvoz</text>

  <!-- Secondary UCs -->
  <ellipse cx="655" cy="160" rx="135" ry="55" class="uc"/>
  <text x="655" y="154" text-anchor="middle" class="label">Pregled statistike</text>
  <text x="655" y="178" text-anchor="middle" class="label">poslovanja</text>

  <ellipse cx="655" cy="285" rx="120" ry="50" class="uc"/>
  <text x="655" y="280" text-anchor="middle" class="label">Izvoz podataka</text>
  <text x="655" y="303" text-anchor="middle" class="label">u CSV</text>

  <ellipse cx="655" cy="405" rx="135" ry="52" class="uc"/>
  <text x="655" y="399" text-anchor="middle" class="label">Generiranje i pregled</text>
  <text x="655" y="423" text-anchor="middle" class="label">grafa</text>

  <!-- Actor association -->
  <line x1="100" y1="250" x2="240" y2="250" class="line"/>

  <!-- include -->
  <line x1="475" y1="215" x2="535" y2="185" class="dash" marker-end="url(#arrow)"/>
  <text x="510" y="192" text-anchor="middle" class="small">&lt;&lt;include&gt;&gt;</text>

  <!-- extends -->
  <line x1="535" y1="285" x2="485" y2="270" class="dash" marker-end="url(#arrow)"/>
  <text x="520" y="264" text-anchor="middle" class="small">&lt;&lt;extend&gt;&gt;</text>

  <line x1="545" y1="390" x2="470" y2="295" class="dash" marker-end="url(#arrow)"/>
  <text x="525" y="350" text-anchor="middle" class="small">&lt;&lt;extend&gt;&gt;</text>

  <!-- Compact notes -->
  <rect x="205" y="475" width="300" height="70" rx="4" class="note"/>
  <text x="220" y="497" class="small">Statistika: zauzetost plovila, broj rezervacija, prihod,</text>
  <text x="220" y="517" class="small">najtraženije kategorije i dodatne usluge.</text>

  <rect x="535" y="475" width="270" height="70" rx="4" class="note"/>
  <text x="550" y="497" class="small">Graf se može generirati pomoću</text>
  <text x="550" y="517" class="small">Python matplotlib/pyplot.</text>
</svg>
